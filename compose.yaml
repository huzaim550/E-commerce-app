# Local / self-hosted deployment.
#   docker compose up --build          (or: podman compose up --build)
# Expose it publicly with a Cloudflare Tunnel:
#   docker compose -f compose.yaml -f compose.tunnel.yaml --profile tunnel up

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store}
      POSTGRES_DB: ${POSTGRES_DB:-store}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-store} -d ${POSTGRES_DB:-store}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published by default — only `web` needs it. Uncomment to use a GUI client.
    # ports:
    #   - "5432:5432"

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Talks to the postgres service over the compose network, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-store}:${POSTGRES_PASSWORD:-store}@postgres:5432/${POSTGRES_DB:-store}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — generate one with: openssl rand -base64 32}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # Set to "true" on first boot to load demo products.
      SEED_ON_START: ${SEED_ON_START:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Keeps locally-stored uploads across container rebuilds.
      - uploads:/app/data/uploads
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
  uploads:
